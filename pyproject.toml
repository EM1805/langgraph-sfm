[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-sfm"
version = "0.1.0"
description = "Causal intent monitoring for LangGraph agents using Structural Final Models."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
  { name = "Emiliano Muharremi" }
]
keywords = [
  "langgraph",
  "langchain",
  "agent-monitoring",
  "ai-safety",
  "causal-inference",
  "intent-detection",
  "structural-final-models",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.4",
  "pandas>=2.2.3,<2.4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "build>=1.2", "twine>=5"]

[project.scripts]
langgraph-sfm-demo = "sfm_langgraph.cli:main"

[project.urls]
Homepage = "https://github.com/emilianomuharremi/langgraph-sfm"
Repository = "https://github.com/emilianomuharremi/langgraph-sfm"
Issues = "https://github.com/emilianomuharremi/langgraph-sfm/issues"
Documentation = "https://github.com/emilianomuharremi/langgraph-sfm#readme"

[tool.setuptools.packages.find]
include = [
  "amantia*",
  "sfm_langgraph*",
  "scm_parts*",
  "estimation_parts*",
  "runtime*",
  "path_parts*",
  "contracts*",
  "common*",
]

[tool.setuptools]
py-modules = ["config", "fs_utils", "runtime_compat", "runtime_env"]

[tool.setuptools.data-files]
"share/langgraph-sfm" = [
  "action_registry.yaml",
  "candidate_family_map.yaml",
  "dangerous_paths.yaml",
  "historical_action_events.jsonl",
  "data/action_event_panel.csv",
  "data.csv",
  "operational_causal_graph.yaml",
  "schema_mapping.yaml",
]
